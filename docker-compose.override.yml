# Este ficheiro é mesclado automaticamente pelo Docker Compose ao executar localmente.
# Permite compilar os serviços sem depender do registry do CI.
# Nunca é copiado para o servidor de deploy — apenas para uso em desenvolvimento.
#
# Uso: docker compose up --build

services:
  postgres-auth:
    ports:
      - "15432:5432"

  postgres-usuario:
    ports:
      - "15433:5432"

  postgres-cliente:
    ports:
      - "15434:5432"

  postgres-servico:
    ports:
      - "15435:5432"

  postgres-os:
    ports:
      - "15436:5432"

  postgres-financeiro:
    ports:
      - "15437:5432"

  postgres-auditoria:
    ports:
      - "15438:5432"

  postgres-notification:
    ports:
      - "15439:5432"

  auth-service:
    build:
      context: ./backend
      dockerfile: auth_service/Dockerfile

  usuario-service:
    build:
      context: ./backend
      dockerfile: usuario_service/Dockerfile

  auditoria-service:
    build:
      context: ./backend
      dockerfile: auditoria_service/Dockerfile

  cliente-service:
    build:
      context: ./backend
      dockerfile: cliente_service/Dockerfile

  financeiro-service:
    build:
      context: ./backend
      dockerfile: financeiro_service/Dockerfile

  os-service:
    build:
      context: ./backend
      dockerfile: os_service/Dockerfile

  notification-service:
    build:
      context: ./backend
      dockerfile: notification_service/Dockerfile

  # ── Serviços ainda não implementados ──────────────────────────────────────
  # Adicionar as entradas abaixo quando os Dockerfiles estiverem disponíveis:
  #
  servico-service:
    build:
      context: ./backend
      dockerfile: servico_service/Dockerfile

