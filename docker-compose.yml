services:
  cliente-service-db:
    container_name: cliente-service-db
    image: postgres:16
    env_file:
      - .env.cliente-service-db
    ports:
      - "5435:5432"
    volumes:
      - cliente-service-db-data:/var/lib/postgresql/data

  cliente-service:
    container_name: erp_cliente_service
    build:
      context: backend/cliente_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - backend/cliente_service/.env
      - .env.cliente-service-db
    volumes:
      - ./backend/cliente_service:/app
    depends_on:
      - cliente-service-db

volumes:
  cliente-service-db-data:
