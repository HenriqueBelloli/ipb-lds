services:
  db-usuario:
    container_name: db-usuario
    image: postgres:16
    env_file:
      - ./backend/usuario_service/.env
    ports:
      - 5433:5432
    volumes:
      - db-usuario-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  usuario-service:
    container_name: usuario-service
    build:
      context: ./backend/usuario_service 
      dockerfile: Dockerfile
    ports:
      - 8000:8002
    env_file:
      - ./backend/usuario_service/.env
    volumes:
      - ./backend/usuario_service/app:/app
    depends_on:
      db-usuario:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  rabbitmq:
    container_name: erp_rabbitmq
    image: rabbitmq:3.12-management
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  db-usuario-data: