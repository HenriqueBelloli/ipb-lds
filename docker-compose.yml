services:

  usuario-service-db:
    container_name: usuario-service-db
    image: postgres:16
    env_file:
      - .env.usuario-service.db
    ports:
      - 5433:5432
    volumes:
      - usuario-service-db-data:/var/lib/postgresql/data

  usuario-service:
    container_name: usuario-service
    build:
      context: backend
      dockerfile: docker_usuario_service/Dockerfile
    ports:
    - 8000:8002
    env_file:
    -  .env.usuario-service
    -  .env.usuario-service.db
    volumes:
      - ./backend/usuario_service:/app
    depends_on:
      - usuario-service-db

volumes:
  usuario-service-db-data:
