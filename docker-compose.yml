services:
  db-usuario:
    container_name: db-usuario
    image: postgres:16
    env_file:
      - ./backend/usuario_service/.env
    ports:
      - 5433:5432
    volumes:
      - db-usuario-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  usuario-service:
    container_name: usuario-service
    build:
      context: ./backend/usuario_service 
      dockerfile: Dockerfile
    ports:
      - 8000:8002
    env_file:
      - ./backend/usuario_service/.env
    volumes:
      - ./backend/usuario_service:/app
    depends_on:
      db-usuario:
        condition: service_healthy

volumes:
  db-usuario-data: