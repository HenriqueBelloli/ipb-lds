services:

  db-usuario:
    container_name: db-usuario
    build:
      context: backend
    image: postgres:16
    env_file:
      - .env
    ports:
      - 5433:5432
    volumes:
      - db-usuario-data:/var/lib/postgresql/data

  usuario-service:
    container_name: usuario-service
    build:
      context: backend
      dockerfile: usuario-service/Dockerfile
    ports:
    - 8000:8002
    env_file:
    -  .env
    volumes:
      - ./backend/usuario_service:/app
    depends_on:
      - db-usuario

volumes:
  db-usuario-data:
