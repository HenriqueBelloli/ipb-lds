events {
    worker_connections 1024;
}

http {
    upstream auth-service    { server auth-service:8001; }
    upstream usuario-service { server usuario-service:8002; }
    # upstream cliente-service  { server cliente-service:8003; }
    # upstream servico-service  { server servico-service:8004; }
    # upstream os-service       { server os-service:8005; }
    # upstream financeiro-service { server financeiro-service:8006; }
    # upstream conciliacao-service { server conciliacao-service:8007; }
    # upstream notification-service { server notification-service:8008; }
    # upstream frontend         { server frontend:3000; }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass         http://auth-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/usuarios/ {
            proxy_pass         http://usuario-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # location /api/clientes/    { proxy_pass http://cliente-service; }
        # location /api/servicos/    { proxy_pass http://servico-service; }
        # location /api/ordens/      { proxy_pass http://os-service; }
        # location /api/financeiro/  { proxy_pass http://financeiro-service; }
        # location /api/conciliacao/ { proxy_pass http://conciliacao-service; }
        # location /api/notificacoes/{ proxy_pass http://notification-service; }
        # location /                 { proxy_pass http://frontend; }
    }
}
